pipeline {
  agent any
  options {
    timeout(time: 60, unit: 'MINUTES')
    disableConcurrentBuilds()
  }
  parameters {
    choice(name: 'BROWSERS', choices: ['chromium', 'all'], description: 'Браузеры E2E')
  }
  environment {
    CI = 'true'
  }

  stages {
    stage('Check tools') {
      steps {
        sh 'node -v && npm -v'
      }
    }

    stage('Install') {
      steps {
        sh 'npm ci'
      }
    }

    stage('Typecheck and lint') {
      steps {
        sh 'npm run typecheck'
        sh 'npm run lint'
      }
    }

    stage('Unit and API') {
      steps {
        sh 'npm run test:pyramid'
      }
    }

    stage('E2E') {
      steps {
        script {
          def targets = [[name: 'chromium', project: 'e2e']]
          if (params.BROWSERS == 'all') {
            targets += [[name: 'firefox', project: 'e2e-firefox'],
                        [name: 'webkit',  project: 'e2e-safari']]
          }
          for (t in targets) {
            def b = t
            catchError(buildResult: 'FAILURE', stageResult: 'FAILURE') {
              stage("E2E ${b.name}") {
                sh "npx playwright install ${b.name}"
                sh "npx playwright test --project=${b.project} --workers=4 --retries=0"
              }
            }
          }
        }
      }
    }
  }

  post {
    always {
      archiveArtifacts artifacts: 'playwright-report/**, test-results/**', allowEmptyArchive: true
    }
  }
}