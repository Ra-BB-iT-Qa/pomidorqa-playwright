# Typecheck и lint, затем unit с API, и только после них браузер на общем стенде.
name: Playwright CI
run-name: Playwright CI • ${{ github.head_ref || github.ref_name }} • ${{ github.actor }}

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      browsers:
        description: Браузеры E2E
        required: true
        default: chromium
        type: choice
        options:
          - chromium
          - all

permissions:
  contents: read
  actions: write

concurrency:
  group: pomidorqa-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: E2E browser plan
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      browsers: ${{ steps.pick.outputs.browsers }}
    steps:
      - name: Choose browsers
        id: pick
        env:
          BROWSER_CHOICE: ${{ github.event.inputs.browsers }}
        run: |
          if [[ "$BROWSER_CHOICE" == "all" ]]; then
            echo 'browsers=["chromium","firefox","webkit","msedge"]' >> "$GITHUB_OUTPUT"
          else
            echo 'browsers=["chromium"]' >> "$GITHUB_OUTPUT"
          fi

  static:
    name: Typecheck and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint tests
        run: npm run lint

  pyramid:
    name: Unit and API
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run unit and API tests
        run: npm run test:pyramid
        env:
          CI: true

      - name: Write pyramid summary
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          {
            echo "### Unit и API"
            echo '```'
            node scripts/pyramid-metrics.mjs --inform playwright-report/results.json
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload pyramid report
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: report-pyramid-${{ github.run_id }}
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 14

  e2e:
    name: E2E / ${{ matrix.browser }}
    needs: [static, pyramid, plan]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Общий стенд не выдерживает несколько браузеров сразу.
      max-parallel: 1
      matrix:
        browser: ${{ fromJSON(needs.plan.outputs.browsers) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Map browser to Playwright project
        id: target
        run: |
          case "${{ matrix.browser }}" in
            chromium) echo "project=e2e" >> "$GITHUB_OUTPUT" ;;
            firefox) echo "project=e2e-firefox" >> "$GITHUB_OUTPUT" ;;
            webkit) echo "project=e2e-safari" >> "$GITHUB_OUTPUT" ;;
            msedge) echo "project=e2e-edge" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Неизвестный браузер ${{ matrix.browser }}" && exit 1 ;;
          esac

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}-${{ matrix.browser }}

      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run E2E
        run: npx playwright test --project=${{ steps.target.outputs.project }}
        env:
          CI: true

      - name: Write E2E summary
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          {
            echo "### E2E / ${{ matrix.browser }}"
            echo '```'
            node scripts/pyramid-metrics.mjs --inform playwright-report/results.json
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: report-e2e-${{ matrix.browser }}-${{ github.run_id }}
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failure diagnostics
        if: ${{ failure() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.browser }}-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  result:
    name: Result
    if: ${{ always() }}
    needs: [static, pyramid, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download test reports
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: report-*
          path: ci-reports

      - name: Publish result and notify Telegram
        env:
          STATIC: ${{ needs.static.result }}
          PYRAMID: ${{ needs.pyramid.result }}
          E2E: ${{ needs.e2e.result }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          label() {
            case "$1" in
              success) echo "прошёл" ;;
              failure) echo "упал" ;;
              cancelled) echo "отменён" ;;
              skipped) echo "пропущен" ;;
              *) echo "$1" ;;
            esac
          }

          event_label() {
            case "$1" in
              pull_request) echo "pull request" ;;
              push) echo "push" ;;
              workflow_dispatch) echo "ручной запуск" ;;
              *) echo "$1" ;;
            esac
          }

          if [[ "$STATIC" == "success" && "$PYRAMID" == "success" && "$E2E" == "success" ]]; then
            headline="Проверки прошли"
          elif [[ "$STATIC" == "failure" || "$PYRAMID" == "failure" || "$E2E" == "failure" ]]; then
            headline="Есть упавшие проверки"
          elif [[ "$STATIC" == "cancelled" || "$PYRAMID" == "cancelled" || "$E2E" == "cancelled" ]]; then
            headline="Прогон отменён"
          else
            headline="Прогон завершился не полностью"
          fi

          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          {
            echo "## ${headline}"
            echo ""
            echo "| Проверка | Результат |"
            echo "| --- | --- |"
            echo "| Typecheck и lint | ${STATIC} |"
            echo "| Unit и API | ${PYRAMID} |"
            echo "| E2E | ${E2E} |"
            echo ""
            echo "Прогон: ${run_url}"
          } | tee -a "$GITHUB_STEP_SUMMARY"

          if find ci-reports -name results.json -print -quit | grep -q .; then
            {
              echo ""
              echo '```'
              node scripts/pyramid-metrics.mjs --inform ci-reports
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
          fi

          text=$(printf '%s\nРепозиторий: %s\nВетка: %s\nСобытие: %s\nАвтор: %s\nTypecheck и lint: %s\nUnit и API: %s\nE2E: %s\nПрогон: %s' \
            "$headline" \
            "$GITHUB_REPOSITORY" \
            "$branch" \
            "$(event_label "$GITHUB_EVENT_NAME")" \
            "$GITHUB_ACTOR" \
            "$(label "$STATIC")" \
            "$(label "$PYRAMID")" \
            "$(label "$E2E")" \
            "$run_url")

          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "::notice::Секреты Telegram не заданы, уведомление пропущено."
          elif ! curl --silent --show-error --fail-with-body \
            --retry 2 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 20 \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}" \
            --data-urlencode "disable_web_page_preview=true" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            > /tmp/telegram-response.json; then
            echo "::warning::Telegram не отправился. Результат проверок от этого не меняется."
          else
            echo "Telegram notification sent."
          fi

          if [[ "$STATIC" == "success" && "$PYRAMID" == "success" && "$E2E" == "success" ]]; then
            exit 0
          fi

          echo "::error::Одна из обязательных проверок не прошла."
          exit 1
