# Typecheck и lint, затем unit с API, и только после них E2E по браузерам на общем стенде.
name: Playwright CI
run-name: Playwright CI • ${{ github.head_ref || github.ref_name }} • ${{ github.actor }}

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      browsers:
        description: Браузеры E2E
        required: true
        default: chromium
        type: choice
        options:
          - chromium
          - all

permissions:
  contents: read
  actions: write

concurrency:
  group: pomidorqa-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: E2E browser plan
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      browsers: ${{ steps.pick.outputs.browsers }}
    steps:
      - name: Choose browsers
        id: pick
        env:
          BROWSER_CHOICE: ${{ github.event.inputs.browsers }}
        run: |
          if [[ "$BROWSER_CHOICE" == "all" ]]; then
            echo 'browsers=["chromium","firefox","webkit","msedge"]' >> "$GITHUB_OUTPUT"
          elif [[ "$BROWSER_CHOICE" == "chromium" ]]; then
            echo 'browsers=["chromium"]' >> "$GITHUB_OUTPUT"
          else
            echo 'browsers=["chromium","firefox","webkit"]' >> "$GITHUB_OUTPUT"
          fi

  static:
    name: Typecheck and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint tests
        run: npm run lint

  pyramid:
    name: Unit and API
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run unit and API tests
        run: npm run test:pyramid
        env:
          CI: true

      - name: Write pyramid summary
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          {
            echo "### Unit и API"
            echo ""
            node scripts/pyramid-metrics.mjs --inform playwright-report/results.json
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload pyramid report
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: report-pyramid-${{ github.run_id }}
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 14

  e2e:
    name: E2E / ${{ matrix.browser }}
    needs: [static, pyramid, plan]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Два браузера одновременно: третий ждёт, чтобы стенд не делил слоты между всеми сразу.
      max-parallel: 2
      matrix:
        browser: ${{ fromJSON(needs.plan.outputs.browsers) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Map browser to Playwright project
        id: target
        run: |
          case "${{ matrix.browser }}" in
            chromium) echo "project=e2e" >> "$GITHUB_OUTPUT" ;;
            firefox) echo "project=e2e-firefox" >> "$GITHUB_OUTPUT" ;;
            webkit) echo "project=e2e-safari" >> "$GITHUB_OUTPUT" ;;
            msedge) echo "project=e2e-edge" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Неизвестный браузер ${{ matrix.browser }}" && exit 1 ;;
          esac

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}-${{ matrix.browser }}

      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run E2E
        run: npx playwright test --project=${{ steps.target.outputs.project }} --workers=4 --retries=0
        env:
          CI: true

      - name: Write E2E summary
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          {
            echo "### E2E / ${{ matrix.browser }}"
            echo ""
            node scripts/pyramid-metrics.mjs --inform playwright-report/results.json
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: report-e2e-${{ matrix.browser }}-${{ github.run_id }}
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failure diagnostics
        if: ${{ failure() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.browser }}-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  result:
    name: Result
    if: ${{ always() }}
    needs: [static, pyramid, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download test reports
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: report-*
          path: ci-reports

      - name: Publish result and notify Telegram
        env:
          STATIC: ${{ needs.static.result }}
          PYRAMID: ${{ needs.pyramid.result }}
          E2E: ${{ needs.e2e.result }}
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          label() {
            case "$1" in
              success) echo "прошёл" ;;
              failure) echo "упал" ;;
              cancelled) echo "отменён" ;;
              skipped) echo "пропущен" ;;
              *) echo "$1" ;;
            esac
          }

          mark() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              *) echo "⬜" ;;
            esac
          }

          status_cell() {
            case "$1" in
              success) echo "✅ Успешно" ;;
              failure) echo "❌ Ошибка" ;;
              cancelled) echo "⬜ Отменено" ;;
              skipped) echo "⬜ Пропущено" ;;
              *) echo "⬜ $1" ;;
            esac
          }

          event_label() {
            case "$1" in
              pull_request) echo "pull request" ;;
              push) echo "push" ;;
              workflow_dispatch) echo "ручной запуск" ;;
              *) echo "$1" ;;
            esac
          }

          if [[ "$STATIC" == "success" && "$PYRAMID" == "success" && "$E2E" == "success" ]]; then
            headline="Проверки прошли"
            overall="success"
          elif [[ "$STATIC" == "failure" || "$PYRAMID" == "failure" || "$E2E" == "failure" ]]; then
            headline="Есть упавшие проверки"
            overall="failure"
          elif [[ "$STATIC" == "cancelled" || "$PYRAMID" == "cancelled" || "$E2E" == "cancelled" ]]; then
            headline="Прогон отменён"
            overall="cancelled"
          else
            headline="Прогон завершился не полностью"
            overall="unknown"
          fi

          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          jobs_tsv=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" --jq '.jobs[] | [.name, (.conclusion // "unknown"), .started_at, .completed_at] | @tsv' || true)

          job_field() {
            printf '%s\n' "$jobs_tsv" | awk -F '\t' -v n="$1" -v c="$2" '$1 == n { print $c; exit }'
          }

          browser_result() {
            job_field "$1" 2
          }

          format_span() {
            node -e '
              const [start, end] = process.argv.slice(1);
              if (!start || !end || start === "null" || end === "null") {
                process.stdout.write("—");
                process.exit(0);
              }
              const sec = Math.round((Date.parse(end) - Date.parse(start)) / 1000);
              if (!Number.isFinite(sec) || sec < 0) {
                process.stdout.write("—");
                process.exit(0);
              }
              const minutes = Math.floor(sec / 60);
              const seconds = sec % 60;
              process.stdout.write(minutes ? `${minutes} мин ${seconds} с` : `${seconds} с`);
            ' "$1" "$2"
          }

          job_duration() {
            format_span "$(job_field "$1" 3)" "$(job_field "$1" 4)"
          }

          e2e_rows=""
          e2e_lines=""
          browser_list=""
          for pair in "E2E / chromium|E2E Chromium|Chromium" "E2E / firefox|E2E Firefox|Firefox" "E2E / webkit|E2E WebKit|WebKit" "E2E / msedge|E2E Edge|Edge"; do
            job_name="${pair%%|*}"
            rest="${pair#*|}"
            title="${rest%%|*}"
            short="${rest#*|}"
            conclusion="$(browser_result "$job_name")"
            if [[ -z "$conclusion" ]]; then
              continue
            fi
            e2e_rows="${e2e_rows}| ${title} | $(status_cell "$conclusion") | $(job_duration "$job_name") |"$'\n'
            e2e_lines="${e2e_lines}$(mark "$conclusion") ${title} — $(label "$conclusion")"$'\n'
            browser_list="${browser_list}${browser_list:+ · }${short}"
          done

          if [[ -z "$e2e_rows" ]]; then
            e2e_rows="| E2E | $(status_cell "$E2E") | $(job_duration "E2E / chromium") |"$'\n'
            e2e_lines="$(mark "$E2E") E2E — $(label "$E2E")"$'\n'
            browser_list="—"
          fi

          node_version="$(node -v)"

          {
            echo "### 1. Проверки качества"
            echo ""
            echo "| Проверка | Статус | Длительность |"
            echo "| --- | --- | --- |"
            echo "| Typecheck и lint | $(status_cell "$STATIC") | $(job_duration "Typecheck and lint") |"
            echo "| Unit и API | $(status_cell "$PYRAMID") | $(job_duration "Unit and API") |"
            printf '%s' "$e2e_rows"
            echo ""
            echo "### 2. Метрики прогона"
            echo ""
          } | tee -a "$GITHUB_STEP_SUMMARY"

          if find ci-reports -name results.json -print -quit | grep -q .; then
            node scripts/pyramid-metrics.mjs --inform ci-reports | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Отчёт тестов не собрался." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

          {
            echo ""
            echo "### 3. Окружение"
            echo ""
            echo "| Параметр | Значение |"
            echo "| --- | --- |"
            echo "| Runner | Linux / X64 |"
            echo "| Node.js | \`${node_version}\` |"
            echo "| Стенд | https://aiqa.su |"
            echo "| Браузеры | ${browser_list} |"
            echo "| Воркеры внутри job | 4 |"
            echo "| Джобы матрицы одновременно | 2 |"
            echo "| Повторы | 0 |"
            echo ""
            echo "Прогон: ${run_url}"
          } | tee -a "$GITHUB_STEP_SUMMARY"

          text=$(printf '%s %s\nРепозиторий: %s\nВетка: %s\nСобытие: %s\nАвтор: %s\n%s Typecheck и lint — %s\n%s Unit и API — %s\n%sПрогон: %s' \
            "$(mark "$overall")" \
            "$headline" \
            "$GITHUB_REPOSITORY" \
            "$branch" \
            "$(event_label "$GITHUB_EVENT_NAME")" \
            "$GITHUB_ACTOR" \
            "$(mark "$STATIC")" \
            "$(label "$STATIC")" \
            "$(mark "$PYRAMID")" \
            "$(label "$PYRAMID")" \
            "$e2e_lines" \
            "$run_url")

          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "::notice::Секреты Telegram не заданы, уведомление пропущено."
          elif ! curl --silent --show-error --fail-with-body \
            --retry 2 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 20 \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}" \
            --data-urlencode "disable_web_page_preview=true" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            > /tmp/telegram-response.json; then
            echo "::warning::Telegram не отправился. Результат проверок от этого не меняется."
          else
            echo "Telegram notification sent."
          fi

          if [[ "$STATIC" == "success" && "$PYRAMID" == "success" && "$E2E" == "success" ]]; then
            exit 0
          fi

          echo "::error::Одна из обязательных проверок не прошла."
          exit 1

      - name: Upload run metrics
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ci-metrics-${{ github.run_id }}
          path: ci-reports/metrics.json
          if-no-files-found: warn
          retention-days: 14
